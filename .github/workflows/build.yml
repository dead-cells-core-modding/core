
name: Build And Test

on: [push, pull_request]

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build,  test, test-build-samples]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Download artifacts win-x64
      uses: actions/download-artifact@v7
      with: 
        name: build-win-x64
        path: win-x64
    - name: Download artifacts linux-x64
      uses: actions/download-artifact@v7
      with: 
        name: build-linux-x64
        path: linux-x64
    - name: Pack win-x64
      run: |
        cd win-x64

        zip -r ../win-x64.zip ./*

        find . -type f -name "*.pdb" -exec rm -f {} \;
        find . -type f -name "*.xml" -exec rm -f {} \;
        rm -rf ./core/mdk

        zip -r ../win-x64-no-mdk.zip ./*

        cp ./core/host/startup/gog/deadcells.exe ../deadcells-gog.exe
    - name: Pack win-x64
      run: |
         cd linux-x64

         zip -r ../linux-x64.zip ./*
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
         body_path: latest-release.md
         files: |
             latest-release.md
             linux-x64.zip
             win-x64.zip
             win-x64-no-mdk.zip
             win-x64/core/host/startup/steam/deadcells.exe
             deadcells-gog.exe

  test:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest]
        debug: [ true ]
        platform: [ steam, gog ]
        include:
          - os: windows-latest
            os_name: win
            arch: x64
          - os: ubuntu-26.04
            os_name: linux
            arch: x64

    runs-on: ${{ matrix.os }}
    needs: build
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10
    - name: Download artifacts
      uses: actions/download-artifact@v7
      with: 
        name: build-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.debug == true && '-Debug' || '' }}
        path: ctx/coremod
    - name: Copy hlboot
      shell: pwsh
      run: |
        echo "DEAD_CELLS_GAME_PATH=$env:GITHUB_WORKSPACE/ctx" >> $env:GITHUB_ENV    
        Copy-Item -Path ./hlboots/hlboot-opengl-${{ matrix.platform }}.dat -Destination "./ctx/hlboot.dat" -Recurse -Force
    - name: Install MDK
      uses: dead-cells-core-modding/setup-mdk@main
      with:
        modcoreroot: ./ctx/coremod
    - name: Install MDK
      if: runner.os == 'Linux'
      run: |
        chmod +x ./ctx/coremod/core/mdk/install-linux.sh
        ./ctx/coremod/core/mdk/install-linux.sh
    - name: Download Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        # Require fixing for SDL3 SDL2-compact
        sudo apt-get update
        sudo apt-get install -y build-essential \
          cmake \
          libpng-dev \
          libturbojpeg-dev \
          libvorbis-dev \
          libopenal-dev \
          libsdl3-dev \
          libglu1-mesa-dev \
          libmbedtls-dev \
          libuv1-dev \
          libsqlite3-dev \
          libjpeg-dev 
    - name: Build ModCore
      shell: pwsh
      run: |
        ./build.ps1 BuildMDK
        ./ctx/coremod/core/mdk/install.ps1
    - name: Run Tests
      shell: pwsh
      id: run_tests
      env:
        DOTNET_DbgEnableMiniDump: 1
        COMPlus_DbgEnableMiniDump: 1
        DOTNET_DbgMiniDumpName: "/tmp/dccm_dump_crash_%d.dmp"
      run: |
        cd sources
        dotnet test
    - name: Upload dumps on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with: 
        name: dumps-${{ matrix.os }}
        path: /tmp/dccm_dump_crash_*.dmp
        retention-days: 7

  test-build-samples:
    runs-on: windows-latest
    needs: build
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with: 
        name: build-win-x64
        path: coremod
    - name: Install MDK
      uses: dead-cells-core-modding/setup-mdk@main
      with:
        modcoreroot: ./coremod
    - name: Build Samples
      shell: pwsh
      run: |
        cd sample
        dotnet build -c Release
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: build-samples
        path: ./sample/bin/*
        

  build:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest]
        debug: [ true, false ]
        include:
          - os: windows-latest
            os_name: win
            arch: x64
          - os: ubuntu-26.04
            os_name: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10
    - name: Setup MSVC (Windows)
      uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
      with: 
        arch: x64
    - name: Download Dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        cd ./sources/native/3rd/hashlink/include

        Invoke-WebRequest -Uri https://github.com/kcat/openal-soft/releases/download/1.23.1/openal-soft-1.23.1-bin.zip -OutFile ./OpenAL.zip
        Expand-Archive -LiteralPath ./OpenAL.zip -DestinationPath . -Force
        Move-Item -Path ./openal-soft-1.23.1-bin -Destination ./openal -Force
        
        Invoke-WebRequest -Uri https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-devel-3.4.10-VC.zip -OutFile ./SDL.zip
        Expand-Archive -LiteralPath ./SDL.zip -DestinationPath . -Force
        Move-Item -Path ./SDL3-3.4.10 -Destination ./sdl -Force
    - name: Download Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential \
          cmake \
          libpng-dev \
          libturbojpeg-dev \
          libvorbis-dev \
          libopenal-dev \
          libsdl3-dev \
          libglu1-mesa-dev \
          libmbedtls-dev \
          libuv1-dev \
          libsqlite3-dev \
          libjpeg-dev 

    - name: Build Core
      shell: pwsh
      run: |
        ./build.ps1 BuildMDK BuildCore BuildNative --configuration ${{ matrix.debug == true && 'Debug' || 'Release' }}
    - name: Install MDK
      uses: dead-cells-core-modding/setup-mdk@main
      with:
        modcoreroot: ./bin
    - name: Build 
      shell: pwsh
      run: |
        ./build.ps1  BuildAssets --configuration ${{ matrix.debug == true && '-Debug' || 'Release' }}

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.debug == true && '-Debug' || '' }}
        path: ./bin/*
