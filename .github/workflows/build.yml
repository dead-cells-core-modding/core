
name: Build And Test

on: [push, pull_request]

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build,  test, test-build-samples]
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with: 
        name: build-win-x64
        path: win-x64
    - name: Pack
      run: |
        cd win-x64

        zip -r ../win-x64.zip ./*

        find . -type f -name "*.pdb" -exec rm -f {} \;
        find . -type f -name "*.xml" -exec rm -f {} \;
        rm -rf ./core/mdk

        zip -r ../win-x64-no-mdk.zip ./*
    - name: Release
      uses: softprops/action-gh-release@v1
      with:
         files: |
             win-x64.zip
             win-x64-no-mdk.zip
             win-x64/core/host/startup/steam/deadcells.exe

  test:
    strategy:
      matrix:
        os: [windows-latest]
        debug: [ true ]
        include:
          - os: windows-latest
            os_name: win
            arch: x64
#          - os: ubuntu-latest
#            os_name: linux
#            arch: x64

    runs-on: ${{ matrix.os }}
    needs: build
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with: 
        name: build-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.debug == true && '-Debug' || '' }}
        path: ctx/coremod
    - name: Copy hlboot
      run: |
        echo "DEAD_CELLS_GAME_PATH=$env:GITHUB_WORKSPACE/ctx" >> $env:GITHUB_ENV    
        Copy-Item -Path ./hlboots/hlboot-opengl-steam.dat -Destination "./ctx/hlboot.dat" -Recurse -Force
    - name: Install MDK
      uses: dead-cells-core-modding/setup-mdk@main
      with:
        modcoreroot: ./ctx/coremod
    - name: Build ModCore
      run: |
        ./build.ps1 -BuildNative 0 -BuildMDK 1 -BuildAssets 0 -BuildCore 0
    - name: Run Tests
      shell: pwsh
      run: |
        cd sources
        
        dotnet test

  test-build-samples:
    runs-on: windows-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with: 
        name: build-win-x64
        path: coremod
    - name: Install MDK
      uses: dead-cells-core-modding/setup-mdk@main
      with:
        modcoreroot: ./coremod
    - name: Build Samples
      run: |
        cd sample
        dotnet build -c Release
    - name: Upload
      uses: actions/upload-artifact@v4.6.0
      with:
        name: build-samples
        path: ./sample/bin/*
        

  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        debug: [ true, false ]
        include:
          - os: windows-latest
            os_name: win
            arch: x64
          - os: ubuntu-latest
            os_name: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10
    - name: Setup MSVC (Windows)
      uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
      with: 
        arch: x64
    - name: Download Dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        cd ./sources/native/3rd/hashlink/include

        Invoke-WebRequest -Uri https://github.com/kcat/openal-soft/releases/download/1.23.1/openal-soft-1.23.1-bin.zip -OutFile ./OpenAL.zip
        Expand-Archive -LiteralPath ./OpenAL.zip -DestinationPath . -Force
        Move-Item -Path ./openal-soft-1.23.1-bin -Destination ./openal -Force
        
        Invoke-WebRequest -Uri https://www.libsdl.org/release/SDL2-devel-2.32.8-VC.zip -OutFile ./SDL.zip
        Expand-Archive -LiteralPath ./SDL.zip -DestinationPath . -Force
        Move-Item -Path ./SDL2-2.32.8 -Destination ./sdl -Force
    - name: Download Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential \
          cmake \
          libpng-dev \
          libturbojpeg-dev \
          libvorbis-dev \
          libopenal-dev \
          libsdl2-dev \
          libglu1-mesa-dev \
          libmbedtls-dev \
          libuv1-dev \
          libsqlite3-dev \
          libjpeg-dev 

    - name: Build Core
      shell: pwsh
      run: |
        ./build.ps1 ${{ matrix.debug == true && '-Debug' || '' }} -BuildAssets 0
    - name: Install MDK
      uses: dead-cells-core-modding/setup-mdk@main
      with:
        modcoreroot: ./bin
    - name: Build Assets
      shell: pwsh
      run: |
        ./build.ps1 ${{ matrix.debug == true && '-Debug' || '' }} -BuildNative 1 -BuildMDK 0 -BuildCore 0 -BuildAssets 1

    - name: Upload
      uses: actions/upload-artifact@v4.6.0
      with:
        name: build-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.debug == true && '-Debug' || '' }}
        path: ./bin/*
